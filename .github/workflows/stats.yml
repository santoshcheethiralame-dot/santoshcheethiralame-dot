name: generate telemetry

on:
  schedule:
    - cron: "17 2 * * *"     # once a day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/fonts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      # The default token counts public activity only. To include private
      # contributions, add a classic PAT (read:user + repo) as STATS_TOKEN.
      - name: render stats-dark.svg / stats-light.svg
        run: python scripts/build_stats.py --user ${{ github.repository_owner }} --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: push to the output-stats branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-stats
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
