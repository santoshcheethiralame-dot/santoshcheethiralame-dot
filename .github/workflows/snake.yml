name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:           # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake from contribution graph (cyberpunk palette)
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: santoshcheethiralame-dot
          # first color = 0 contributions, then low -> high. '#' is literal inside this block.
          outputs: |
            dist/snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#d8b4fe,#a78bfa,#7c3aed,#4c1d95
            dist/snake-dark.svg?color_snake=#00f5d4&color_dots=#0d1117,#4c1d95,#7c3aed,#a78bfa,#e9d5ff

      - name: push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
