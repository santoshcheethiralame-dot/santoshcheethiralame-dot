name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:           # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake from contribution graph (amber/cyan, matches README)
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: santoshcheethiralame-dot
          # first color = 0 contributions, then low -> high. '#' is literal inside this block.
          outputs: |
            dist/snake.svg?color_snake=#0A7886&color_dots=#ebedf0,#f7ddb5,#ecb96d,#d48a2c,#b4630b
            dist/snake-dark.svg?color_snake=#4FD6E5&color_dots=#161b22,#3b2a14,#7a5420,#c48632,#ffb454

      - name: push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
